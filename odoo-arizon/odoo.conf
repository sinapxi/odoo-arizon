[options]
; --- Contraseña Maestra ---
; ¡IMPORTANTE! Establece una contraseña maestra segura para las operaciones de base de datos.
; Descomenta y cambia la siguiente línea:
admin_passwd = Eitemm09*

; --- Configuración de Base de Datos (parámetros principales se pasarán por CLI) ---
; db_host se pasará como argumento de línea de comandos.
; db_host = ${DB_HOST}
; db_port se pasará como argumento de línea de comandos.
; db_port = ${PGPORT}
; db_user se pasará como argumento de línea de comandos.
; db_user = ${PGUSER}
; db_password se pasará como argumento de línea de comandos.
; db_password = ${PGPASSWORD}
; db_name está explícitamente configurado abajo, no necesita pasarse por CLI si es fijo.
;db_name = railway
db_sslmode = prefer

; --- Rutas de Addons ---
; ¡CRÍTICO! Esta es la configuración más importante que debes verificar y ajustar.
; Debe apuntar a las carpetas donde residen tus módulos de Odoo (estándar y personalizados)
; DENTRO del contenedor de Railway (que normalmente usa /app/ como raíz de tu proyecto).
;
; Ejemplo 1: Si la raíz de tu proyecto (/app/) contiene directamente las carpetas 'addons' (estándar de Odoo)
; y 'custom_addons' (tus módulos personalizados):
; addons_path = /app/addons,/app/custom_addons
;
; Ejemplo 2: Si la raíz de tu proyecto (/app/) es una instalación completa de Odoo y también tienes
; una carpeta para módulos enterprise y otra para módulos locales:
; addons_path = /app/addons,/app/enterprise,/app/local_addons
;
; Ejemplo 3: Si tu código de Odoo (con su carpeta 'addons') está en un subdirectorio como '/app/odoo_core/'
; y tus módulos personalizados están en '/app/my_custom_modules/':
; addons_path = /app/my_custom_modules,/app/odoo_core/addons
;
; POR FAVOR, AJUSTA LA SIGUIENTE LÍNEA CUIDADOSAMENTE A TU ESTRUCTURA:
addons_path = /app/addons,/app/odoo/addons

; --- Directorio de Datos (Filestore) ---
; Usará el volumen montado por Railway, tomado de la variable de entorno.
data_dir = ${RAILWAY_VOLUME_MOUNT_PATH}

; --- Configuración del Servidor Web ---
; http_port y http_interface se establecen en el comando de inicio de Railway.
; proxy_mode se puede tomar de la variable de entorno ODOO_PROXY_MODE (que tienes configurada como True),
; pero también es bueno establecerlo explícitamente aquí.
proxy_mode = True

; --- Workers ---
; El número de workers (workers=2) se establece en el comando de inicio de Railway.
; Puedes ajustar límites de memoria aquí si es necesario, pero es recomendable
; empezar sin ellos para ver cómo se comporta con la configuración de Railway.
; Ejemplo de límites (descomenta y ajusta si los necesitas):
; limit_memory_hard = 2684354560 ; (2.5GB)
; limit_memory_soft = 2147483648 ; (2GB)
; limit_request = 8192
; limit_time_cpu = 600
; limit_time_real = 1200

; --- Logging ---
; logfile se establece a /dev/stdout en el comando de inicio de Railway para que los logs aparezcan en Railway.
; log_level se puede ajustar aquí si necesitas más detalle (ej. debug, info, warn, error, critical)
log_level = info
; log_db = False ; Descomenta y pon a True para loguear queries SQL si necesitas depurar problemas de base de datos.

; --- Otras configuraciones ---
list_db = True ; Importante para producción. No mostrar la lista de bases de datos en la pantalla de login.
; without_demo = all ; Ya está en tu comando de inicio, pero puedes tenerlo aquí también.
; dbfilter = ^%d$ ; Si quieres filtrar bases de datos por subdominio o nombre de host. %d es el nombre de la BD.
;dbfilter = ^railway$
; xmlrpc_interface = 127.0.0.1 ; Opcional: para restringir xmlrpc a localhost si solo usas http.
; csv_internal_sep = ,
unaccent = False ; Descomenta y pon a True si necesitas que las búsquedas no distingan acentos (requiere módulo 'unaccent' en PostgreSQL). 